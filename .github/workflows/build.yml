name: Build openvpn-aws

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenVPN version (e.g. 2.6.20)'
        required: false
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect upstream version
        id: detect
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_BUILT=$(cat LAST_BUILT_VERSION 2>/dev/null || echo "0")
          PINNED=$(grep '^OPENVPN_VERSION' Makefile | cut -d= -f2 | tr -d ' ')
          echo "pinned=$PINNED last_built=$LAST_BUILT"

          if [[ "$PINNED" != "$LAST_BUILT" ]]; then
            echo "version=$PINNED" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and patch file
        id: version
        run: |
          VER="${{ needs.check-upstream.outputs.version }}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          if [[ "$MAJOR" -ge 2 && "$MINOR" -ge 7 ]]; then
            echo "prefix_patch=patches/push-reply-prefix-fix-2.7.x.patch" >> "$GITHUB_OUTPUT"
          else
            echo "prefix_patch=patches/push-reply-prefix-fix.patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libssl-dev liblzo2-dev liblz4-dev libcap-ng-dev libnl-3-dev libnl-genl-3-dev \
            libpkcs11-helper1-dev libsystemd-dev libpam0g-dev
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Download OpenVPN source
        run: |
          VER=${{ steps.version.outputs.ver }}
          curl -L "https://github.com/OpenVPN/openvpn/archive/refs/tags/v${VER}.tar.gz" | tar xz
          mv "openvpn-${VER}" openvpn-source

      - name: Apply patches
        run: |
          cd openvpn-source
          patch -p1 < "$GITHUB_WORKSPACE/0001-unprivileged.patch" || echo "::warning::Unprivileged patch failed (optional)"
          patch -p1 < "$GITHUB_WORKSPACE/aws.patch" || {
            echo "::error::aws.patch failed on OpenVPN ${{ steps.version.outputs.ver }} — buffer size + TLS encoding patches need rebase"
            exit 1
          }
          patch -p1 < "$GITHUB_WORKSPACE/${{ steps.version.outputs.prefix_patch }}" || {
            echo "::error::Prefix-fix patch failed on OpenVPN ${{ steps.version.outputs.ver }}"
            exit 1
          }

      - name: Build
        run: |
          cd openvpn-source
          autoreconf -fvi
          CONFIGURE_ARGS="--prefix=/usr --disable-dependency-tracking"
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            CONFIGURE_ARGS="$CONFIGURE_ARGS --host=aarch64-linux-gnu"
          fi
          ./configure CC=${{ matrix.cc }} $CONFIGURE_ARGS
          make -j$(nproc)

      - name: Verify binary
        run: |
          BINARY=openvpn-source/src/openvpn/openvpn
          SIZE=$(stat -c%s "$BINARY")
          echo "Binary size: ${SIZE} bytes"
          if [[ "$SIZE" -lt 500000 || "$SIZE" -gt 2000000 ]]; then
            echo "::error::Binary size ${SIZE} outside expected range (500KB-2MB)"
            exit 1
          fi

      - name: Smoke test
        run: |
          BINARY=openvpn-source/src/openvpn/openvpn
          "$BINARY" --version 2>&1 | head -2
          strings "$BINARY" | grep -q '_REPLY' || {
            echo "::error::PUSH_REPLY prefix-fix not applied: '_REPLY' string not found in binary"
            exit 1
          }
          strings "$BINARY" | grep -q '_FAILED' || {
            echo "::error::AUTH_FAILED prefix-fix not applied: '_FAILED' string not found in binary"
            exit 1
          }

      - name: Package
        run: |
          mkdir -p output
          strip openvpn-source/src/openvpn/openvpn
          cp openvpn-source/src/openvpn/openvpn "output/openvpn-aws-${{ matrix.arch }}"
          cd output
          sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-aws-${{ matrix.arch }}-${{ steps.version.outputs.ver }}
          path: output/

  release:
    needs: [check-upstream, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          echo "ver=${{ needs.check-upstream.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: openvpn-aws ${{ steps.version.outputs.ver }}
          body: |
            Patched OpenVPN ${{ steps.version.outputs.ver }} for AWS Client VPN.

            **Patches applied:**
            - `0001-unprivileged.patch` — unprivileged mode
            - `aws.patch` — large SAML token support (256KB buffer)
            - `push-reply-prefix-fix.patch` — AWS control channel message prefix handling

            **Verification:** Binary contains `_REPLY` and `_FAILED` handling for AWS VPN server's 3-byte prefixed control messages.
          files: artifacts/*

      - name: Update LAST_BUILT_VERSION
        run: |
          echo "${{ steps.version.outputs.ver }}" > LAST_BUILT_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LAST_BUILT_VERSION
          git diff --cached --quiet || git commit -m "UPDATE: LAST_BUILT_VERSION -> ${{ steps.version.outputs.ver }}"
          git push

  patch-conflict:
    needs: [check-upstream, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'failure' && needs.check-upstream.outputs.should_build == 'true'
    permissions:
      issues: write
    steps:
      - name: Create patch conflict issue
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ needs.check-upstream.outputs.version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ACTION REQUIRED: Patch conflict on OpenVPN ${ver}`,
              body: `The automated build failed for OpenVPN ${ver}. This likely means \`aws.patch\` or \`push-reply-prefix-fix.patch\` does not apply cleanly.\n\n**Steps to fix:**\n1. Download OpenVPN ${ver} source\n2. Rebase the patches manually\n3. Push updated patches to master\n4. Re-run the workflow\n\n[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['patch-conflict', 'automated']
            });
