name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenVPN version (e.g. 2.6.12)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(grep '^OPENVPN_VERSION' Makefile | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libssl-dev liblzo2-dev liblz4-dev libcap-ng-dev \
            libnl-3-dev libnl-genl-3-dev libpkcs11-helper1-dev libsystemd-dev \
            libpam0g-dev

      - name: Download and patch OpenVPN
        run: |
          make fetch patch OPENVPN_VERSION=${{ steps.version.outputs.ver }}

      - name: Build
        run: |
          cd openvpn-source
          autoreconf -fvi
          ./configure --prefix=/usr --sbindir=/usr/bin
          make -j$(nproc)
          strip src/openvpn/openvpn

      - name: Package
        run: |
          mkdir -p output
          cp openvpn-source/src/openvpn/openvpn "output/openvpn-aws-${{ steps.version.outputs.ver }}-x86_64"
          cd output && sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-aws-${{ steps.version.outputs.ver }}
          path: output/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(grep '^OPENVPN_VERSION' Makefile | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvpn-aws-${{ steps.version.outputs.ver }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: openvpn-aws ${{ steps.version.outputs.ver }}
          files: artifacts/*
          generate_release_notes: true
