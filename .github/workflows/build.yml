name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenVPN version (e.g. 2.7.4)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - openvpn_version: "2.6.20"
            channel: "2.6.x"
          - openvpn_version: "2.7.4"
            channel: "2.7.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=manual" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${{ matrix.openvpn_version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ matrix.channel }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Select patch directory
        id: patches
        run: |
          VER=${{ steps.version.outputs.ver }}
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          DIR="patches/${MAJOR}.${MINOR}.x"
          if [[ ! -d "$DIR" ]]; then
            echo "ERROR: No patches for OpenVPN ${MAJOR}.${MINOR}.x (looked in $DIR)"
            echo "Available: $(ls -d patches/*/)"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using patches from $DIR"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libssl-dev liblzo2-dev liblz4-dev libcap-ng-dev \
            libnl-3-dev libnl-genl-3-dev libpkcs11-helper1-dev libsystemd-dev \
            libpam0g-dev

      - name: Download OpenVPN source
        run: |
          VER=${{ steps.version.outputs.ver }}
          curl -L "https://github.com/OpenVPN/openvpn/archive/refs/tags/v${VER}.tar.gz" | tar xz
          mv "openvpn-${VER}" openvpn-source

      - name: Apply patches
        run: |
          cd openvpn-source
          PATCHDIR="${{ steps.patches.outputs.dir }}"
          for p in "$GITHUB_WORKSPACE/$PATCHDIR"/*.patch; do
            echo "Applying $(basename "$p")..."
            patch -p1 < "$p"
          done

      - name: Build
        run: |
          cd openvpn-source
          autoreconf -fvi
          ./configure --prefix=/usr --sbindir=/usr/bin
          make -j$(nproc)
          strip src/openvpn/openvpn

      - name: Package
        run: |
          VER=${{ steps.version.outputs.ver }}
          mkdir -p output
          cp openvpn-source/src/openvpn/openvpn "output/openvpn-aws-${VER}-x86_64"
          cd output && sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-aws-${{ steps.version.outputs.ver }}
          path: output/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - openvpn_version: "2.6.20"
            channel: "2.6.x"
          - openvpn_version: "2.7.4"
            channel: "2.7.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=manual" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${{ matrix.openvpn_version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ matrix.channel }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvpn-aws-${{ steps.version.outputs.ver }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: openvpn-aws ${{ steps.version.outputs.ver }} (${{ steps.version.outputs.channel }})
          files: artifacts/*
          generate_release_notes: true
